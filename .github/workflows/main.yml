name: Scheduled Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"


jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scrape on v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run scrape-all-sites.yml --ref v1.0  --repo vladislavzalesak/KamNaSutaz

