name: Update SADS events

on:
  schedule:
    - cron: "32 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape SADS events
        run: python scripts/scrape_sads.py

      - name: Commit scrape result and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add data/sads.json data/sads_*.csv
          git commit --allow-empty -m "Update SADS event data"
          git push
