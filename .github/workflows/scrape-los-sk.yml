name: Update LOS-SK events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Scrape LOS-SK events
        run: python scripts/scrape_los_sk.py

      - name: Commit scrape result and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add data/los-sk.json data/los-sk_*.csv
          git commit --allow-empty -m "Update LOS-SK event data"
          git push
