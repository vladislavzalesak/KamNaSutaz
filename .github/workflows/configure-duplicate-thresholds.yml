name: Configure duplicate thresholds

on:
  workflow_dispatch:
    inputs:
      possible_threshold:
        description: "Minimum similarity percentage for possible duplicates (0-100)"
        type: number
        required: true
        default: 65
      strict_threshold:
        description: "Minimum similarity percentage for strict duplicates (0-100)"
        type: number
        required: true
        default: 88

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
        with:
          ref: v1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore previously deployed data
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/restore_pages_data.py "$PAGES_BASE_URL"

      - name: Write duplicate thresholds
        env:
          POSSIBLE_THRESHOLD: ${{ inputs.possible_threshold }}
          STRICT_THRESHOLD: ${{ inputs.strict_threshold }}
        run: python scripts/duplicate_thresholds.py "$POSSIBLE_THRESHOLD" "$STRICT_THRESHOLD"

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css site.webmanifest \
            duplicate-thresholds.json \
            android-chrome-192x192.png android-chrome-512x512.png \
            apple-touch-icon.png favicon.ico favicon-16x16.png \
            favicon-32x32.png _site/
          cp -R assets _site/assets
          cp -R data/. _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
