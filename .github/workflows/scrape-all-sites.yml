name: Scrape and deploy event calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: v1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore previously deployed data
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/restore_pages_data.py "$PAGES_BASE_URL"

      - name: Scrape LOS-SK
        id: scrape_los_sk
        continue-on-error: true
        run: python scripts/scrape_los_sk.py

      - name: Scrape SQUAD
        id: scrape_squad
        continue-on-error: true
        run: python scripts/scrape_squad.py

      - name: Scrape Shooting Area
        id: scrape_shootingarea
        continue-on-error: true
        run: python scripts/scrape_shootingarea.py

      - name: Scrape SADS
        id: scrape_sads
        continue-on-error: true
        run: python scripts/scrape_sads.py

      - name: Scrape RDA IPSC
        id: scrape_rda
        continue-on-error: true
        run: python scripts/scrape_rda.py

      - name: Scrape SZVVZ
        id: scrape_szvvz
        continue-on-error: true
        run: python scripts/scrape_szvvz.py

      - name: Remove unreferenced CSV snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("data")
          referenced = set()
          for manifest_path in data_dir.glob("*.json"):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              filename = manifest.get("file")
              if filename is not None:
                  csv_path = data_dir / filename
                  if not csv_path.is_file():
                      raise FileNotFoundError(f"Manifest references missing CSV: {csv_path}")
                  referenced.add(filename)

          for csv_path in data_dir.glob("*.csv"):
              if csv_path.name not in referenced:
                  csv_path.unlink()
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css site.webmanifest CHANGELOG.md \
            duplicate-thresholds.json \
            android-chrome-192x192.png android-chrome-512x512.png \
            apple-touch-icon.png favicon.ico favicon-16x16.png \
            favicon-32x32.png _site/
          cp -R assets _site/assets
          cp -R data/. _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report scraper failures
        if: always()
        env:
          LOS_SK_SCRAPE: ${{ steps.scrape_los_sk.outcome }}
          SQUAD_SCRAPE: ${{ steps.scrape_squad.outcome }}
          SHOOTINGAREA_SCRAPE: ${{ steps.scrape_shootingarea.outcome }}
          SADS_SCRAPE: ${{ steps.scrape_sads.outcome }}
          RDA_SCRAPE: ${{ steps.scrape_rda.outcome }}
          SZVVZ_SCRAPE: ${{ steps.scrape_szvvz.outcome }}
        run: |
          if [[ "$LOS_SK_SCRAPE" != "success" || \
                "$SQUAD_SCRAPE" != "success" || \
                "$SHOOTINGAREA_SCRAPE" != "success" || \
                "$SADS_SCRAPE" != "success" || \
                "$RDA_SCRAPE" != "success" || \
                "$SZVVZ_SCRAPE" != "success" ]]; then
            echo "One or more event scrapers failed; previous data was retained where available." >&2
            exit 1
          fi
