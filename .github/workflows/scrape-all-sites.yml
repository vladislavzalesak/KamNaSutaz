name: Scrape all event sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape LOS-SK
        id: los_sk
        continue-on-error: true
        run: python scripts/scrape_los_sk.py

      - name: Scrape SQUAD
        id: squad
        continue-on-error: true
        run: python scripts/scrape_squad.py

      - name: Scrape Shooting Area
        id: shootingarea
        continue-on-error: true
        run: python scripts/scrape_shootingarea.py

      - name: Scrape SADS
        id: sads
        continue-on-error: true
        run: python scripts/scrape_sads.py

      - name: Commit scrape results and statuses
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/
          git commit --allow-empty -m "Update event data from all sources"
          git push

      - name: Report scraper failures
        if: always()
        env:
          LOS_SK_RESULT: ${{ steps.los_sk.outcome }}
          SQUAD_RESULT: ${{ steps.squad.outcome }}
          SHOOTINGAREA_RESULT: ${{ steps.shootingarea.outcome }}
          SADS_RESULT: ${{ steps.sads.outcome }}
        run: |
          if [[ "$LOS_SK_RESULT" != "success" || \
                "$SQUAD_RESULT" != "success" || \
                "$SHOOTINGAREA_RESULT" != "success" || \
                "$SADS_RESULT" != "success" ]]; then
            echo "One or more event scrapers failed." >&2
            exit 1
          fi
