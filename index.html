<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Prehľad nadchádzajúcich streleckých súťaží.">
    <meta property="og:title" content="Kam na súťaž">
  <meta property="og:description" content="Kalendár streleckých podujatí na jednom mieste. Nájdi preteky. Klikni. Súťaž.">
  <meta property="og:image" content="https://vladislavzalesak.github.io/KamNaSutaz/assets/images/banner.png">
  <meta property="og:url" content="https://vladislavzalesak.github.io/KamNaSutaz/">
  <meta property="og:type" content="website">
    <title>Kam na súťaž</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Kalendár podujatí</p>
        <h1>Kam na súťaž</h1>
        <p id="debug-banner" class="debug-banner" hidden>
          Lokálny náhľad: používajú sa testovacie dáta.
        </p>
        <button id="feedback-button" class="feedback-button" type="button">
          Spätná väzba
        </button>
        <section class="source-status" aria-labelledby="source-status-heading">
          <h2 id="source-status-heading">Aktualizácia zdrojov</h2>
          <div id="source-status" class="source-status-grid" role="list"></div>
        </section>
      </header>

      <div class="filter-groups">
        <div
          id="date-filters"
          class="date-filters"
          role="group"
          aria-label="Filtrovať súťaže podľa obdobia"
        >
          <button class="date-filter-button" type="button" data-range="all" aria-pressed="true">
            Všetky
          </button>
          <button class="date-filter-button" type="button" data-range="year" aria-pressed="false">
            Tento rok
          </button>
          <button class="date-filter-button" type="button" data-range="30-days" aria-pressed="false">
            Do 30 dní
          </button>
        </div>
        <div
          id="duplicate-filters"
          class="date-filters"
          role="group"
          aria-label="Zoskupiť duplicitné súťaže"
        >
          <button class="date-filter-button" type="button" data-mode="none" aria-pressed="false">
            Samostatné riadky
          </button>
          <button class="date-filter-button" type="button" data-mode="show" aria-pressed="true">
            Možné zhody
          </button>
          <button class="date-filter-button" type="button" data-mode="hide" aria-pressed="false">
            Iba isté zhody
          </button>
        </div>
      </div>

      <section aria-labelledby="events-heading">
        <h2 id="events-heading">Najbližšie súťaže</h2>
        <p id="status" class="status" role="status" aria-live="polite">Načítavam súťaže…</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Dátum</th>
                <th scope="col">Názov preteku</th>
                <th scope="col">Typ súťaže</th>
                <th scope="col">Miesto</th>
                <th scope="col">Zdroje a odkazy</th>
              </tr>
            </thead>
            <tbody id="events"></tbody>
          </table>
        </div>
      </section>
      <footer>
        Údaje sa obnovujú každý deň.
        <a href="CHANGELOG.md">História zmien</a>
      </footer>
    </main>
  </body>
</html>
